<div class="p-6 min-h-screen">
  <div class="space-y-4" *ngIf="bookings$ | async as bookings">
    <ng-container *ngIf="bookings.length === 0; else bookingList">
      <div class="flex items-center justify-center min-h-[60vh]">
        <div class="text-3xl text-center text-gray-600 max-w-xl">
          You don’t have any bookings yet. <br />Start by choosing a coworking space.
        </div>
      </div>
    </ng-container>
    <ng-template #bookingList>
      <h1 class="text-2xl font-bold mb-4">My bookings on Green Coworking</h1>
      <app-my-bookings-item
        *ngFor="let booking of bookings"
        [booking]="booking"
        (bookingDeleted)="onBookingDeleted()">
      </app-my-bookings-item>
    </ng-template>
  </div>
</div>
